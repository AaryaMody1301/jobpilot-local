name: Phase 6 acceptance

on:
  push:
    branches: ["phase-6-**"]
    paths:
      - ".github/workflows/phase6.yml"
      - "migrations/**"
      - "packaging/**"
      - "pyproject.toml"
      - "pylock.toml"
      - "requirements-lock.in"
      - "scripts/install_ci_dependencies.ps1"
      - "scripts/phase6_application_acceptance.py"
      - "src/**"
      - "tests/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-phase6:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.15'
          cache: pip
      - name: Install locked project dependencies
        shell: pwsh
        run: .\scripts\install_ci_dependencies.ps1
      - name: Install pinned Playwright Chromium
        run: python -m playwright install chromium
      - name: Validate Python and JavaScript syntax
        run: |
          python -m compileall -q src scripts tests
          node --check src/jobpilot/ui/app.js
          node --check src/jobpilot/ui/phase5.js
          node --check src/jobpilot/ui/phase6.js
      - name: Run deterministic regression suite
        run: pytest -m "not external"
      - name: Run controlled localhost Playwright acceptance
        run: python scripts/phase6_application_acceptance.py
      - name: Run source desktop checks
        run: |
          python -m jobpilot.app.main --self-test
          python -m jobpilot.app.main --window-smoke
      - name: Build desktop onedir
        run: pyinstaller --clean --noconfirm packaging\jobpilot.spec
      - name: Run packaged desktop checks
        run: |
          .\dist\jobpilot-local\jobpilot-local.exe --self-test
          .\dist\jobpilot-local\jobpilot-local.exe --window-smoke
