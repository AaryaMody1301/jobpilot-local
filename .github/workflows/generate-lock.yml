name: Generate dependency lock

on:
  push:
    branches: [final-repository-cleanup]
    paths:
      - "requirements-lock.in"
      - "requirements-build.in"
      - ".github/workflows/generate-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - name: Install pinned pip
        run: python -m pip install "pip==26.2.1"
      - name: Generate Windows dependency lock
        run: python -m pip lock --build-constraint requirements-build.in -r requirements-lock.in -o pylock.toml
      - name: Commit dependency lock
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pylock.toml
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Lock Windows CI dependencies"
          git pull --rebase origin final-repository-cleanup
          git push origin HEAD:final-repository-cleanup
