name: Generate dependency lock

on:
  push:
    branches: [final-repository-cleanup]
    paths:
      - "requirements-lock.in"
      - ".github/workflows/generate-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
      - name: Install pinned pip
        run: python -m pip install "pip==26.2.1"
      - name: Generate Windows dependency lock
        run: python -m pip lock -r requirements-lock.in -o pylock.toml
      - name: Print dependency lock
        shell: pwsh
        run: Get-Content -Raw pylock.toml
