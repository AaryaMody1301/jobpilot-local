name: Phase 9 acceptance

on:
  push:
    branches: ["main", "phase-9-**"]
    paths:
      - ".github/workflows/phase9.yml"
      - "migrations/**"
      - "packaging/**"
      - "pyproject.toml"
      - "pylock.toml"
      - "requirements-lock.in"
      - "requirements-build.in"
      - "scripts/install_ci_dependencies.ps1"
      - "scripts/build_distribution.py"
      - "scripts/phase9_*.py"
      - "src/**"
      - "tests/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-phase9:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.15'
          cache: pip
      - name: Install locked project dependencies
        shell: pwsh
        run: .\scripts\install_ci_dependencies.ps1
      - name: Audit installed Python dependencies
        run: python -m pip_audit
      - name: Install test Chromium
        run: python -m playwright install chromium
      - name: Validate Python and JavaScript syntax
        run: |
          python -m compileall -q src scripts tests
          node --check src/jobpilot/ui/app.js
          node --check src/jobpilot/ui/phase5.js
          node --check src/jobpilot/ui/phase6.js
          node --check src/jobpilot/ui/phase8.js
          node --check src/jobpilot/ui/phase9.js
      - name: Run deterministic regression suite
        run: pytest -m "not external"
      - name: Verify explicit Phase 9 pilot safety gates
        run: pytest tests/unit/test_phase9_pilot.py tests/unit/test_phase9_hardening.py -q
      - name: Verify backup restore and inactive-by-default pilot
        run: python scripts/phase9_distribution_acceptance.py
      - name: Preserve Phase 8 orchestration boundary
        run: python scripts/phase8_orchestration_acceptance.py
      - name: Preserve Phase 7 provider boundary
        run: python scripts/phase7_platform_acceptance.py
      - name: Run source desktop checks
        shell: pwsh
        run: |
          python -m jobpilot.app.main --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m jobpilot.app.main --window-smoke
          $windowExit = $LASTEXITCODE
          if ($windowExit -ne 0) {
            Write-Warning "Hidden WebView2 smoke failed once; retrying in a fresh process to distinguish transient host initialization from a persistent product failure."
            Start-Sleep -Seconds 2
            python -m jobpilot.app.main --window-smoke
            $windowExit = $LASTEXITCODE
          }
          if ($windowExit -ne 0) { exit $windowExit }
      - name: Build onedir with hermetic Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pyinstaller --clean --noconfirm packaging\jobpilot.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged app without browser environment
        shell: pwsh
        run: |
          Remove-Item Env:PLAYWRIGHT_BROWSERS_PATH -ErrorAction SilentlyContinue
          .\dist\jobpilot-local\jobpilot-local.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\jobpilot-local\jobpilot-local.exe --browser-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\jobpilot-local\jobpilot-local.exe --window-smoke
          $windowExit = $LASTEXITCODE
          if ($windowExit -ne 0) {
            Write-Warning "Packaged hidden WebView2 smoke failed once; retrying once in a fresh process."
            Start-Sleep -Seconds 2
            .\dist\jobpilot-local\jobpilot-local.exe --window-smoke
            $windowExit = $LASTEXITCODE
          }
          if ($windowExit -ne 0) { exit $windowExit }
      - name: Build verified Windows distribution
        run: python scripts/build_distribution.py
      - name: Verify clean install and in-place upgrade
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "JobPilotLocalAppData"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $archive = Get-ChildItem .\dist\JobPilotLocal-*-win-x64.zip | Select-Object -First 1
          if (-not $archive) { throw "distribution archive missing" }
          $extract = Join-Path $env:RUNNER_TEMP "JobPilotDistribution"
          $install = Join-Path $env:RUNNER_TEMP "JobPilotInstalled"
          Remove-Item $extract,$install -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $package = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          & (Join-Path $package.FullName "install.ps1") -InstallRoot $install -SkipShortcut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = Join-Path $env:LOCALAPPDATA "JobPilotLocal"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Set-Content -LiteralPath (Join-Path $data "upgrade-preserved.txt") -Value "preserve"
          & (Join-Path $package.FullName "install.ps1") -InstallRoot $install -SkipShortcut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content -LiteralPath (Join-Path $data "upgrade-preserved.txt") -Raw).Trim() -ne "preserve") { throw "upgrade changed user data" }
          Remove-Item Env:PLAYWRIGHT_BROWSERS_PATH -ErrorAction SilentlyContinue
          $installedExe = Join-Path $install "jobpilot-local.exe"
          & $installedExe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedExe --browser-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedExe --window-smoke
          $windowExit = $LASTEXITCODE
          if ($windowExit -ne 0) {
            Write-Warning "Installed hidden WebView2 smoke failed once; retrying once in a fresh process."
            Start-Sleep -Seconds 2
            & $installedExe --window-smoke
            $windowExit = $LASTEXITCODE
          }
          if ($windowExit -ne 0) { exit $windowExit }
      - name: Upload verified distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jobpilot-local-phase9-windows-x64
          path: |
            dist/JobPilotLocal-*-win-x64.zip
            dist/JobPilotLocal-*-win-x64.sha256
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-phase9
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jobpilot-local-phase9-windows-x64
          path: release-assets
      - name: Publish immutable version release if absent
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find release-assets -maxdepth 1 -name 'JobPilotLocal-*-win-x64.zip' -print -quit)"
          checksum="$(find release-assets -maxdepth 1 -name 'JobPilotLocal-*-win-x64.sha256' -print -quit)"
          test -n "$archive" && test -n "$checksum"
          name="$(basename "$archive")"
          version="${name#JobPilotLocal-}"
          version="${version%-win-x64.zip}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it immutable."
          else
            gh release create "$tag" "$archive" "$checksum" --target "$GITHUB_SHA" --title "JobPilot Local $tag" --notes "Verified Windows 10/11 x64 release. Phase 4's five-real-resume gate and Phase 9's measured real-world pilot remain private local acceptance gates; this release does not claim those gates are complete."
          fi
      - name: Delete obsolete merged branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in "fix-template-map-ui-guard" "phase-0-feasibility-architecture" "phase-1-desktop-foundation" "phase-2-real-resume-finalization" "phase-2-resume-fact-bank" "phase-3-local-ai-resource-manager" "phase-3-stage" "phase-3-stage-tests" "phase-3-stage-tests2" "phase-4-evidence-tailoring" "phase-4-finalization" "phase-4-stage" "phase-5-job-discovery-matching" "phase-6-controlled-application-engine" "phase-7-supported-platform-adapters" "phase-8-end-to-end-orchestration" "phase-9-distribution-backup-restore" "phase-9-final-closeout" "phase-9-final-hardening" "phase-9-pilot-activation" "tmp-no" "final-repository-cleanup"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

