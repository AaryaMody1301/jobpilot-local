name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "migrations/**"
      - "packaging/**"
      - "pyproject.toml"
      - "pylock.toml"
      - "requirements-lock.in"
      - "requirements-build.in"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-ci:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: pylock.toml
      - name: Install locked dependencies
        shell: pwsh
        run: .\scripts\install_ci_dependencies.ps1
      - name: Audit installed Python dependencies
        run: python -m pip_audit
      - name: Install pinned Playwright Chromium
        run: python -m playwright install chromium
      - name: Validate source syntax
        run: |
          python -m compileall -q src scripts tests
          node --check src/jobpilot/ui/app.js
      - name: Run deterministic regression suite
        run: pytest -m "not external"
      - name: Run source desktop smoke
        shell: pwsh
        run: |
          python -m jobpilot.app.main --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m jobpilot.app.main --browser-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m jobpilot.app.main --window-smoke
          $windowExit = $LASTEXITCODE
          if ($windowExit -ne 0) {
            Write-Warning "Hidden WebView2 smoke failed once; retrying in a fresh process."
            Start-Sleep -Seconds 2
            python -m jobpilot.app.main --window-smoke
            $windowExit = $LASTEXITCODE
          }
          if ($windowExit -ne 0) { exit $windowExit }
