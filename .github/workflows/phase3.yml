name: Phase 3 acceptance

on:
  push:
    branches: [phase-3-local-ai-resource-manager]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-phase3:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
          cache: pip
      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install pinned Playwright Chromium
        run: python -m playwright install chromium
      - name: Validate Python and JavaScript syntax
        run: |
          python -m compileall -q src scripts tests
          node --check src/jobpilot/ui/app.js
      - name: Run Phase 0 through Phase 3 non-external checks
        run: pytest -m "not external"
      - name: Preserve Phase 2 Tectonic acceptance
        run: python scripts/phase2_tectonic_acceptance.py
      - name: Run real local llama.cpp and model acceptance
        run: python scripts/phase3_model_acceptance.py
      - name: Run source self-test
        run: python -m jobpilot.app.main --self-test
      - name: Run hidden pywebview window smoke
        run: python -m jobpilot.app.main --window-smoke
      - name: Build Phase 3 desktop onedir
        run: pyinstaller --clean --noconfirm packaging\jobpilot.spec
      - name: Run packaged self-test
        run: .\dist\jobpilot-local\jobpilot-local.exe --self-test
      - name: Run packaged hidden-window smoke
        run: .\dist\jobpilot-local\jobpilot-local.exe --window-smoke
