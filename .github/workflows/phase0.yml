name: Phase 0 acceptance

on:
  push:
    branches: [main, "phase-0-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-phase0:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install locked project dependencies
        shell: pwsh
        run: .\scripts\install_ci_dependencies.ps1
      - name: Install pinned Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
        run: python -m playwright install chromium
      - name: Run Phase 0 non-external checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
        run: pytest -m "not external"
      - name: Build PyInstaller onedir feasibility probe
        run: pyinstaller --clean --noconfirm packaging\phase0-probe.spec
      - name: Run packaged self-test
        run: .\dist\jobpilot-phase0-probe\jobpilot-phase0-probe.exe --self-test
