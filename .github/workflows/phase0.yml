name: Phase 0 acceptance

on:
  push:
    branches: [main, "phase-0-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-phase0:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install pinned Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
        run: python -m playwright install chromium
      - name: Run Phase 0 non-external checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
        run: pytest -m "not external"
      - name: Build PyInstaller onedir feasibility probe
        run: pyinstaller --clean --noconfirm packaging\phase0-probe.spec
      - name: Run packaged self-test
        run: .\dist\jobpilot-phase0-probe\jobpilot-phase0-probe.exe --self-test
