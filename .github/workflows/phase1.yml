name: Phase 1 acceptance

on:
  push:
    branches: [phase-1-desktop-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-phase1:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.15'
          cache: pip
      - name: Install locked project dependencies
        shell: pwsh
        run: .\scripts\install_ci_dependencies.ps1
      - name: Install pinned Playwright Chromium
        run: python -m playwright install chromium
      - name: Run Phase 0 and Phase 1 non-external checks
        run: pytest -m "not external"
      - name: Run source self-test
        run: python -m jobpilot.app.main --self-test
      - name: Run hidden pywebview window smoke
        run: python -m jobpilot.app.main --window-smoke
      - name: Build Phase 1 desktop onedir
        run: pyinstaller --clean --noconfirm packaging\jobpilot.spec
      - name: Run packaged self-test
        run: .\dist\jobpilot-local\jobpilot-local.exe --self-test
      - name: Run packaged hidden-window smoke
        run: .\dist\jobpilot-local\jobpilot-local.exe --window-smoke
